<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Untinted Bolt + Handle</title>
    <style>
      :root {
        --bg1: #0b0d12;
        --bg2: #131b2e;
        --panel: rgba(17, 24, 39, 0.75);
        --text: #edf3ff;
        --muted: #b9c5dd;
        --accent: #7cc9ff;
      }

      html, body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at top, var(--bg2), var(--bg1) 55%);
        color: var(--text);
        font-family: Inter, Arial, sans-serif;
        overflow: hidden;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      #info {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 10;
        background: var(--panel);
        padding: 12px 16px;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      }

      #info h1 {
        margin: 0 0 6px;
        font-size: 1.1rem;
        font-weight: 700;
      }

      #info p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      #info strong {
        color: var(--accent);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="info">
        <h1>Untinted Bolt + Handle</h1>
        <p><strong>Loaded from source OBJ</strong> with the tint removed and handle added.</p>
      </div>
    </div>

    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
      import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
      import { OBJLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/OBJLoader.js';

      const app = document.getElementById('app');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0d12);
      scene.fog = new THREE.Fog(0x0b0d12, 6, 20);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(2.8, 1.8, 3.8);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      app.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0.2, 0.1, 0);
      controls.enablePan = false;
      controls.minDistance = 1.2;
      controls.maxDistance = 12;

      const ambient = new THREE.HemisphereLight(0xffffff, 0x1b2233, 1.3);
      scene.add(ambient);

      const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
      keyLight.position.set(4, 5, 5);
      keyLight.castShadow = true;
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0x7cc9ff, 0.7);
      fillLight.position.set(-4, 2, -3);
      scene.add(fillLight);

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(4, 96),
        new THREE.MeshStandardMaterial({
          color: 0x1b2332,
          roughness: 0.85,
          metalness: 0.15,
        })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -1.2;
      floor.receiveShadow = true;
      scene.add(floor);

      const handleMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.7,
        metalness: 0.2,
      });

      const handle = new THREE.Mesh(
        new THREE.TorusGeometry(0.52, 0.09, 24, 120),
        handleMaterial
      );
      handle.rotation.y = Math.PI / 2;
      handle.position.set(1.55, 0.0, 0.0);
      scene.add(handle);

      const handleStem = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.12, 0.9, 32),
        handleMaterial
      );
      handleStem.rotation.z = Math.PI / 2;
      handleStem.position.set(1.0, 0.0, 0.0);
      scene.add(handleStem);

      const boltGroup = new THREE.Group();
      scene.add(boltGroup);

      async function loadBolt() {
        const url = 'https://raw.githubusercontent.com/K0KOCHINS/pxielsniperdiamond/main/Bolt_13188892855.obj';
        const response = await fetch(url);
        let text = await response.text();

        text = text.replace(/0\.9300 0\.8500 0\.7000/g, '1.0 1.0 1.0');

        const loader = new OBJLoader();
        const obj = loader.parse(text);

        obj.traverse((child) => {
          if (child.isMesh) {
            child.material = new THREE.MeshStandardMaterial({
              color: 0xffffff,
              roughness: 0.75,
              metalness: 0.15,
            });
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        obj.scale.setScalar(1.1);
        obj.rotation.y = Math.PI / 2;
        obj.rotation.z = -0.1;
        obj.position.set(-0.45, -0.2, 0.0);
        boltGroup.add(obj);
      }

      loadBolt().catch((err) => {
        console.error('Failed to load OBJ', err);
      });

      function animate() {
        requestAnimationFrame(animate);
        handle.rotation.x += 0.006;
        handle.rotation.z += 0.008;
        controls.update();
        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
